name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    # A real PostgreSQL, not a mock. The tenant-isolation guarantees this
    # product sells on are enforced by Row-Level Security, and RLS behaviour
    # cannot be verified against a fake.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_user:app_dev_password@localhost:5432/restaurant_platform_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_platform_test
      TEST_DATABASE_URL: postgresql://app_user:app_dev_password@localhost:5432/restaurant_platform_test
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_platform_test
      PLATFORM_DOMAIN: localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Bootstrap database roles and schemas
        env:
          PGPASSWORD: postgres
        run: |
          psql -U postgres -h localhost -v ON_ERROR_STOP=1 -f scripts/db/bootstrap.sql
          psql -U postgres -h localhost -d restaurant_platform_test -v ON_ERROR_STOP=1 -f scripts/db/grants.sql

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: verify

    env:
      PLATFORM_DOMAIN: localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./storage
      DATABASE_URL: postgresql://app_user:app_dev_password@localhost:5432/restaurant_platform_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
